services:

  apan5210-streamlit-app:
      image: streamlit-python3.11:latest
      container_name: apan5210-streamlit-app
      env_file: .env
      build:
          context: .
          dockerfile: ./docker/streamlit/Dockerfile
      command: streamlit run Home.py --server.port 19501
      networks:
          - apan5210-net
      volumes:
          - ./app-streamlit:/usr/src/app
          - ./app-streamlit/files:/tmp/files
          - ./app-streamlit/db:/tmp/db
      ports:
          - 19501:19501

  apan5210-ollama:
      image: ollama/ollama:latest
      ports:
          - 39870:11434
      volumes:
          - ~/Documents/ollama/code:/code
          - ~/Documents/ollama/ollama:/root/.ollama
      container_name: apan5210-ollama
      pull_policy: always
      tty: true
      environment:
          - OLLAMA_KEEP_ALIVE=24h
          - OLLAMA_HOST=0.0.0.0
      networks:
          - apan5210-net


  apan5210-ollama-webui:
      image: ghcr.io/open-webui/open-webui:main
      container_name: apan5210-ollama-webui
      volumes:
          - ~/Documents/ollama/ollama-webui:/app/backend/data
      ports:
          - 39090:8080
      environment: # https://docs.openwebui.com/getting-started/env-configuration#default_models
          - OLLAMA_BASE_URLS=http://host.docker.internal:39870 #comma separated ollama hosts
          - ENV=dev
          - WEBUI_AUTH=False
          - WEBUI_NAME=HYPER AI
          - WEBUI_URL=http://localhost:39090
          - WEBUI_SECRET_KEY=t0p-s3cr3t
          - OPENAI_API_KEY=temp-api-key
      extra_hosts:
          - host.docker.internal:host-gateway
      depends_on:
        - apan5210-ollama
      networks:
        - apan5210-net

networks:
  apan5210-net:
    driver: bridge
